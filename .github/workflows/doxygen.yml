name: Build and deploy documentation

# One job publishes the whole site as a Pages artifact (no gh-pages branch),
# because each deploy replaces the site and two workflows would wipe each
# other's output. The release image the web installer flashes is served from
# that artifact, so it never lands in any git history.
#
#   docs.cryptnox.com/cryptnox-pos/       Sphinx guide (docs/source)
#   docs.cryptnox.com/cryptnox-pos/api/   Doxygen API reference (docs/Doxyfile)

on:
  push:
    branches:
      - master
      - main
  # A new release changes the image the web installer serves.
  release:
    types: [published]
  workflow_dispatch:

# pages: write lets the job set the Pages source and deploy; id-token: write
# lets deploy-pages prove the artifact comes from this workflow.
permissions:
  contents: read
  pages: write
  id-token: write

# A newer deploy waits for the running one instead of racing it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-docs:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      # 1. Checkout repository. The cryptnox-sdk-esp32 submodule is excluded
      #    from the Doxygen INPUT (it ships its own documentation), so we
      #    skip submodule init to keep the checkout fast.
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 2. Install Doxygen (pinned: Ubuntu's apt ships 1.9.x which does not
      #    understand the `> [!IMPORTANT]` GitHub-style alert syntax we use in
      #    README.md) and Graphviz. Pulled from the doxygen/doxygen GitHub
      #    releases (GitHub CDN) rather than doxygen.nl, whose file server
      #    intermittently returns 5xx/404 (wget exit 8) and failed the job on a
      #    single hiccup; wget also retries transient HTTP errors as a backstop.
      - name: Install Doxygen and Graphviz
        env:
          DOXYGEN_VERSION: "1.17.0"
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz wget
          # Extract in /tmp so the bundled examples/ directory does NOT end
          # up inside the repo and get picked up by INPUT = . recursive.
          wget -q --tries=5 --retry-connrefused --waitretry=5 \
            --retry-on-http-error=403,404,429,500,502,503,504 \
            -O /tmp/doxygen.tar.gz \
            "https://github.com/doxygen/doxygen/releases/download/Release_${DOXYGEN_VERSION//./_}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          tar xf /tmp/doxygen.tar.gz -C /tmp
          sudo install "/tmp/doxygen-${DOXYGEN_VERSION}/bin/doxygen" /usr/local/bin/doxygen
          doxygen --version

      - name: Install Sphinx and its extensions
        run: |
          sudo apt-get install -y libcairo2
          pip install -r docs/requirements.txt

      # 3. Build the guide. -W turns warnings into errors: a broken cross
      #    reference or a figure with no file fails the build instead of
      #    shipping.
      - name: Build Sphinx
        run: sphinx-build -W -b html docs/source site

      # 3b. The browser installer on flashing.html (ESP Web Tools) fetches the
      #     image itself, and GitHub release assets carry no CORS headers, so
      #     the latest release's -full.bin is copied into the site next to a
      #     manifest. No release yet (a fork) leaves the button without one.
      - name: Add the latest release image for the web installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/flash
          # The tag in the file name makes each release a new URL, so a browser
          # never flashes an image it cached from the previous one.
          if tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName) &&
             gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*-full.bin' --output "site/flash/cryptnox-pos-${tag}-full.bin"; then
            cat > site/flash/manifest.json <<EOF
          {
            "name": "Cryptnox POS",
            "version": "${tag}",
            "builds": [
              { "chipFamily": "ESP32", "parts": [ { "path": "cryptnox-pos-${tag}-full.bin", "offset": 0 } ] }
            ]
          }
          EOF
          else
            echo "::warning::No release with a -full.bin; the web installer has nothing to flash."
          fi

      # 4. Build the API reference into site/api/
      - name: Generate Doxygen docs
        run: |
          doxygen docs/Doxyfile
          mkdir -p site/api
          cp -r docs/html/. site/api/

      # 5. Pages must take its site from this workflow, not from a branch.
      #    Set here so the site does not hang on a manual setting; if the
      #    token may not change it, fail saying what to do rather than
      #    deploying into the void.
      - name: Point GitHub Pages at this workflow
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq .build_type 2>/dev/null || echo unknown)
          echo "Pages source is currently: ${current}"
          if [ "${current}" = "workflow" ]; then
            exit 0
          fi
          if gh api -X PUT "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow; then
            echo "Pages source set to GitHub Actions."
          else
            echo "::error::The workflow token may not change the Pages source. A repository admin must set Settings > Pages > Source to 'GitHub Actions'."
            exit 1
          fi

      # 6. Deploy the combined tree to GitHub Pages
      - name: Upload the site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
